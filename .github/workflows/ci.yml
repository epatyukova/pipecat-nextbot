name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          uv sync --locked --all-groups
          uv sync --locked --project server

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find . \( -name .venv -o -path ./server \) -prune -o -type f -name '*.py' -print0)
          # Pass these files explicitly because mypy skips hidden directories.
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No Python source exists yet; skipping mypy.'
          else
            uv run mypy "${files[@]}"
          fi

      - name: Type check bot
        run: uv run --locked mypy --python-executable server/.venv/bin/python server

      - name: Test
        shell: bash
        run: |
          if [ -d tests ] && find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            uv run pytest
          else
            echo 'No tests exist yet; skipping pytest.'
          fi
